# https://autobencoder.com/2020-08-24-conda-actions/

name: Build and test

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: conda-incubator/setup-miniconda@v4.1.0
        with:
          python-version: '3.13'          
          activate-environment: test          
          auto-activate-base: false
          channels: conda-forge          
          channel-priority: strict

      - name: Installation        
        run: |          
          conda info -a
          conda list
          conda install -c conda-forge scipy h5py sphinx sphinx_rtd_theme ipython nbsphinx tqdm astropy configobj asciitree matplotlib numpydoc mpich mpi4py pytest-cov zarr gfortran_linux-64 gcc_linux-64
          pip install coveralls
          pip install torch

      - name: Build
        run: |
          conda list
          pip install .

      - name: Test with pytest
        run: |          
          pytest -v --cov-report lcov --cov hazel

      - name: Publish to coveralls.io
        uses: coverallsapp/github-action@v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage.lcov
